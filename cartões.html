  <style>
:root{color-scheme:dark;--bg:#09090b;--surface:#141418;--elevated:#1c1c22;--purple:#a78bfa;--text:#fafafa;--muted:#94949f;--green:#34d399;--red:#fb7185;--line:#2a2a31;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}

.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app-shell{max-width:430px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg)}

.icon-button .icon{width:20px;height:20px}
.greeting{margin:22px 0 5px;color:var(--muted);font-size:14px;letter-spacing:-.01em}

.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:19px 0 24px}.metric{min-width:0}
.metric+.metric{padding-left:22px;border-left:1px solid var(--line)}
.metric-label{font-size:12px;color:var(--muted);margin:0 0 8px;white-space:nowrap}

.text-link{border:0;background:transparent;color:var(--purple);font-size:12px;font-weight:600;padding:12px 0;min-height:44px}

.quick-action{border:0;background:var(--surface);border-radius:17px;color:var(--text);padding:17px 16px 16px;min-height:98px;display:flex;align-items:flex-start;flex-direction:column;justify-content:space-between;text-align:left;font-weight:600;font-size:13px;letter-spacing:-.02em}

.bottom-nav{position:fixed;z-index:15;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:calc(70px + var(--safe-bottom));padding:7px 9px calc(8px + var(--safe-bottom));background:rgba(20,20,24,.96);border-top:1px solid #25252b;display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(18px)}

.month-picker{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12px;font-weight:650}

.bank-list{display:flex;flex-direction:column;gap:14px}
.bank-card{position:relative;overflow:hidden;width:100%;text-align:left;border:1px solid #34303b;color:var(--text);background:#211f27;border-radius:23px;min-height:196px;padding:21px 22px 19px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s ease,border-color .18s ease}

.bank-card::after{content:"";position:absolute;width:330px;height:330px;border:1px solid #ffffff0a;border-radius:50%;top:-180px;right:-110px;pointer-events:none}
.bank-card.ink{background:#202027;border-color:#33333b}
.bank-card.slate{background:#1c2224;border-color:#303b39}

.action-menu{position:fixed;z-index:32;bottom:calc(149px + var(--safe-bottom));right:max(18px,calc((100vw - 430px)/2 + 18px));width:min(320px,calc(100vw - 36px));background:var(--elevated);border:1px solid #34343b;border-radius:20px;padding:6px;box-shadow:0 18px 50px #0008;animation:menu-in .2s ease}

.sheet{position:fixed;z-index:35;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);max-height:calc(93dvh - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--elevated);border-radius:26px 26px 0 0;padding:10px 24px calc(26px + var(--safe-bottom));box-shadow:0 -18px 55px #0008;animation:sheet-in .24s cubic-bezier(.2,.8,.2,1)}

.sheet-person .avatar{width:42px;height:42px}
.sheet-person strong{font-size:13px}
.sheet-person p{font-size:11px;color:var(--muted);margin:4px 0 0}
.sheet-back{background:transparent;border:0;color:var(--purple);font-weight:600;font-size:12px;min-height:44px;padding:0;margin-top:5px}
.amount-field{position:relative;margin:24px 0 13px}

.amount-field .prefix{position:absolute;left:17px;bottom:17px;color:var(--muted);font-size:18px;font-weight:600}

.primary-button{width:100%;min-height:52px;border:0;border-radius:15px;background:var(--purple);color:#151019;font-size:14px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:9px}

.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(85px + var(--safe-bottom));width:min(calc(100vw - 32px),390px);background:#292930;border:1px solid #42424a;color:var(--text);border-radius:13px;padding:13px 16px;font-size:12px;line-height:1.4;box-shadow:0 12px 35px #0008}

.data-warning strong{display:block;font-size:13px}.data-warning p{margin:6px 0}.data-warning button{background:transparent;border:0;color:#ff9aaa;font-weight:700;min-height:44px;padding:0}

.detail-menu{margin-left:auto;background:transparent}
.detail-hero h1{overflow-wrap:anywhere}

.simple-list{margin:0 -24px}

.row-main{flex:1;min-width:0}.row-main strong{display:block;font-size:13px;line-height:1.35;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-main small{display:block;font-size:11px;line-height:1.35;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chart-item{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;flex:1;min-width:0;height:100%;background:transparent;border:0;color:var(--muted);padding:0}

/* Regras financeiras compatíveis com os registros do NexCell Cartões v1. */
(function (root) {
  'use strict';
  const KEYS = Object.freeze({ third: 'nexcell_cartoes_v1', expenses: 'nexcell_minhas_despesas_v1', personalCards: 'nexcell_cartoes_pessoais_v1' });

  const money = cents => `R$ ${digits(cents)}`;
  const inputMoney = cents => digits(cents);
  function parseMoney(raw, max = 100000000000) {
    const s = String(raw).trim();
    const grouped = /^\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?$/.test(s);
    if (!grouped && !/^\d+(?:[.,]\d{1,2})?$/.test(s)) throw new Error('Digite um valor em reais. Ex.: 1.500,50.');
    const normalized = grouped ? s.replace(/\./g, '') : s;
    const [whole, fraction = ''] = normalized.replace(',', '.').split('.');
    const cents = BigInt(whole) * 100n + BigInt(fraction.padEnd(2, '0'));
    if (cents <= 0n || cents > BigInt(max)) throw new Error('Informe um valor válido maior que zero.');
    return Number(cents);
  }
  function sum(values) {
    return values.reduce((total, value) => {
      const next = total + value;
      if (!Number.isSafeInteger(next)) throw new Error('O total ultrapassa o limite de cálculo seguro.');
      return next;
    }, 0);
  }
  function validDate(date) {
    if (typeof date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;
    const d = new Date(`${date}T12:00:00Z`);
    return Number.isFinite(d.getTime()) && d.toISOString().slice(0, 10) === date;
  }
  const validMonth = month => typeof month === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(month) && +month.slice(0, 4) >= 1;
  function shiftMonth(month, offset) {
    const [year, number] = month.split('-').map(Number);
    const d = new Date(Date.UTC(year, number - 1 + offset, 1));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;

  const text = value => typeof value === 'string' && value.trim().length > 0;

    }

      unique(purchase.id);

  }

      ids.add(card.id);
    }
    return cards;
  }
  function validateExpenses(expenses) {
    if (!Array.isArray(expenses)) throw new Error('Despesas pessoais inválidas.');
    const ids = new Set();
    for (const item of expenses) {
      if (!item || typeof item.id !== 'string' || !item.id.trim() || ids.has(item.id) || !text(item.description) || typeof item.cardId !== 'string' || !Number.isSafeInteger(item.total) || item.total <= 0 || !validMonth(item.firstMonth) || !Array.isArray(item.parts) || item.parts.length < 1 || item.parts.length > 120) throw new Error('Há uma despesa pessoal inválida.');

      let total = 0;
      item.parts.forEach((part, index) => {

    }
    return expenses;
  }
  function makePurchase(data, old = null) {
    const values = split(data.totalCents, data.count);
    const changed = old && (old.totalCents !== data.totalCents || old.count !== data.count || old.cardId !== data.cardId || old.firstMonth !== data.firstMonth);
    if (changed && old.installments.some(i => i.payments.length)) throw new Error('Esta compra já tem recebimentos. Corrija os pagamentos antes de alterar valor, parcelas, cartão ou primeira fatura.');

      id: old && !changed ? old.installments[index].id : uuid(), number: index + 1,
      amountCents: value, invoiceMonth: shiftMonth(data.firstMonth, index), expectedDate: monthlyDate(data.expectedDate, index),
      payments: old && !changed ? old.installments[index].payments : []
    }));
    return { ...(old || {}), id: old?.id || uuid(), ...data, installments };
  }

    const result = clone(cards);
    for (const expense of expenses) {
      if (result.some(card => card.id === expense.cardId)) continue;
      const old = thirdCards.find(card => card.id === expense.cardId);
      result.push({ id: expense.cardId, name: old?.name || 'Cartão anterior', closingDay: old?.closingDay || 1, dueDay: old?.dueDay || 1 });
    }

  }
  const api = { KEYS, emptyThird, clone, today, currentMonth, uuid, money, digits, inputMoney, parseMoney, sum, validDate, validMonth, shiftMonth, dayInMonth, monthlyDate, split, suggestMonth, received, pending, flat, validateThird, validatePersonalCards, validateExpenses, makePurchase, migratePersonalCards };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.NexcellFinance = api;
})(typeof window !== 'undefined' ? window : globalThis);

(() => {

  const F = window.NexcellFinance;
  const $ = id => document.getElementById(id);
  const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const monthName = value => new Date(`${value}-01T12:00:00`).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

      F.validateThird(next);
      localStorage.setItem(F.KEYS.third, JSON.stringify(next));
      state.third = next;
      state.raw.third = JSON.stringify(next);
      render();
      if (message) showToast(message);
      return true;
    } catch (error) { showToast(storageMessage(error)); return false; }
  }
  function commitPersonal(kind, change, message) {
    if (state.errors.personalCards || state.errors.expenses) { showToast('Os dados pessoais estão inválidos. Restaure um backup válido.'); return false; }
    try {
      if (localStorage.getItem(F.KEYS.personalCards) !== state.raw.personalCards || localStorage.getItem(F.KEYS.expenses) !== state.raw.expenses) { readAll(); render(); throw new Error('Os dados pessoais mudaram em outra aba. A tela foi atualizada; tente novamente.'); }
      const cards = F.clone(state.personalCards), expenses = F.clone(state.expenses);
      change(cards, expenses);
      F.validatePersonalCards(cards);
      F.validateExpenses(expenses);
      if (expenses.some(item => !cards.some(card => card.id === item.cardId))) throw new Error('Uma despesa ficou sem cartão pessoal.');
      const value = JSON.stringify(kind === 'cards' ? cards : expenses);
      localStorage.setItem(kind === 'cards' ? F.KEYS.personalCards : F.KEYS.expenses, value);
      state.personalCards = cards; state.expenses = expenses;
      state.raw[kind === 'cards' ? 'personalCards' : 'expenses'] = value;
      render();
      if (message) showToast(message);
      return true;
    } catch (error) { showToast(storageMessage(error)); return false; }
  }

  const entries = () => F.flat(state.third);
  const openEntries = () => entries().filter(x => F.pending(x.installment) > 0);
  const cardById = id => state.third.cards.find(card => card.id === id);
  const personKey = name => String(name).trim().toLocaleLowerCase('pt-BR');
  const late = x => F.pending(x.installment) > 0 && x.installment.expectedDate < today();
  const paidInMonth = month => F.sum(entries().flatMap(x => x.installment.payments).filter(pay => pay.date.slice(0, 7) === month).map(pay => pay.amountCents));
  const totalPending = () => F.sum(entries().map(x => F.pending(x.installment)));
  const totalLate = () => F.sum(openEntries().filter(late).map(x => F.pending(x.installment)));
  const sumEntry = (list, getter) => F.sum(list.map(getter));
  function people() {
    const groups = new Map();
    for (const purchase of state.third.purchases) {
      const key = personKey(purchase.person);
      if (!groups.has(key)) groups.set(key, { key, name: purchase.person, purchases: [], entries: [] });
      groups.get(key).purchases.push(purchase);
      purchase.installments.forEach(installment => groups.get(key).entries.push({ purchase, installment }));
    }
    return [...groups.values()].map(person => ({ ...person, pending: sumEntry(person.entries, x => F.pending(x.installment)), received: sumEntry(person.entries, x => F.received(x.installment)) }))
      .sort((a, b) => b.pending - a.pending || a.name.localeCompare(b.name, 'pt-BR'));
  }
  function status(x) {
    const remaining = F.pending(x.installment);
    return remaining === 0 ? ['Pago', 'paid'] : late(x) ? ['Atrasado', 'late'] : F.received(x.installment) > 0 ? ['Parcial', 'partial'] : ['Pendente', ''];
  }
  function warningBanner() {

  }
  function header() {

  function transaction(x, action = 'pay-entry') {

      <section aria-label="Próximos recebimentos"><div class="section-heading"><h2>Próximos recebimentos</h2><button class="text-link" type="button" data-action="all-receipts">Ver todos</button></div><div class="transaction-list">${upcoming.length ? upcoming.slice(0, 7).map(x => transaction(x)).join('') : empty('Tudo em dia', state.third.cards.length ? 'Nenhuma parcela pendente por enquanto.' : 'Cadastre um cartão e sua primeira compra.', 'check')}</div></section>`;
  }
  function cardSummary(card) {

  function downloadJSON(filename, payload) {

    const anchor = document.createElement('a');

    document.body.append(anchor); anchor.click(); anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function exportBackup(kind) {
    try {
      if ((kind === 'all' && Object.keys(state.errors).length) || (kind === 'third' && state.errors.third) || (kind === 'own' && (state.errors.personalCards || state.errors.expenses))) throw new Error('Há dados inválidos neste navegador. Restaure um backup antes de exportar.');
      if (kind === 'third') downloadJSON(`nexcell-cartoes-${today()}.json`, { ...state.third, exportedAt: new Date().toISOString() });
      if (kind === 'own') downloadJSON('nexcell-minhas-despesas.json', { version: 2, expenses: state.expenses, personalCards: state.personalCards });
      if (kind === 'all') downloadJSON(`nexcell-completo-${today()}.json`, { format: 'nexcell-completo-v3', version: 3, exportedAt: new Date().toISOString(), third: state.third, personalCards: state.personalCards, expenses: state.expenses });
      showToast('Backup exportado.');
    } catch (error) { showToast(storageMessage(error)); }
  }
  function restoreValues(updates) {
    const previous = Object.fromEntries(Object.keys(updates).map(key => [key, localStorage.getItem(key)]));
    try {
      for (const [key, value] of Object.entries(updates)) localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
      for (const [key, value] of Object.entries(previous)) {
        try { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value); } catch { /* Conteúdo anterior permanece sempre que o navegador permitir. */ }
      }
      throw error;
    }
    readAll(); render();
  }
  async function importBackup(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      let updates, description;
      if (data?.format === 'nexcell-completo-v3' && data.version === 3) {
        const third = F.validateThird(F.clone(data.third));
        const expenses = F.validateExpenses(F.clone(data.expenses));
        const cards = F.validatePersonalCards(F.clone(data.personalCards));
        if (expenses.some(x => !cards.some(c => c.id === x.cardId))) throw new Error('Há despesas sem cartão pessoal no backup.');
        updates = { [F.KEYS.third]: third, [F.KEYS.personalCards]: cards, [F.KEYS.expenses]: expenses };
        description = `${third.cards.length} cartão(ões) de terceiros, ${third.purchases.length} compra(s) e ${expenses.length} despesa(s) pessoal(is)`;
      } else if (data?.version === 1) {
        const third = F.validateThird(F.clone(data));
        updates = { [F.KEYS.third]: third };
        description = `${third.cards.length} cartão(ões) e ${third.purchases.length} compra(s) de terceiros`;
      } else if (data?.version === 2 && Array.isArray(data.expenses) && Array.isArray(data.personalCards)) {
        const expenses = F.validateExpenses(F.clone(data.expenses));
        const cards = F.validatePersonalCards(F.clone(data.personalCards));
        if (expenses.some(x => !cards.some(c => c.id === x.cardId))) throw new Error('Há despesas sem cartão pessoal no backup.');
        updates = { [F.KEYS.personalCards]: cards, [F.KEYS.expenses]: expenses };
        description = `${cards.length} cartão(ões) e ${expenses.length} despesa(s) pessoal(is)`;
      } else throw new Error('Formato de backup não reconhecido.');
      confirmAction('Restaurar backup', `O arquivo contém ${description}. Os dados atuais das mesmas categorias serão substituídos. Exporte um backup antes de continuar.`, () => {
        try { restoreValues(updates); showToast('Backup restaurado.'); return true; } catch (error) { showToast(storageMessage(error)); return false; }
      }, { danger: true, button: 'Restaurar dados' });
    } catch (error) { showToast(`Arquivo não restaurado. ${storageMessage(error)}`); }
  }
  function showContext(type) {
    const detail = ui.detail;
    if (!detail) return;
    const settings = {
      'card-menu': { title: 'Cartão', options: [{ action: 'edit-card', icon: 'edit', label: 'Editar cartão' }, { action: 'delete-card', icon: 'trash', label: 'Excluir cartão' }] },
      'purchase-menu': { title: 'Compra', options: [{ action: 'edit-purchase', icon: 'edit', label: 'Editar compra' }, { action: 'delete-purchase', icon: 'trash', label: 'Excluir compra' }] },
      'own-card-menu': { title: 'Cartão pessoal', options: [{ action: 'edit-own-card', icon: 'edit', label: 'Editar cartão pessoal' }, { action: 'delete-own-card', icon: 'trash', label: 'Excluir cartão pessoal' }] },
      'expense-menu': { title: 'Despesa pessoal', options: [{ action: 'edit-expense', icon: 'edit', label: 'Editar despesa' }, { action: 'delete-expense', icon: 'trash', label: 'Excluir despesa' }] }
    };
    openSheet('context', { ...settings[type], targetId: detail.id });
  }
  function contextAction(action, id) {
    closeOverlays();
    if (action === 'edit-card') { openSheet('card-form', { id }); return; }
    if (action === 'edit-purchase') { openPurchase(id); return; }
    if (action === 'edit-own-card') { openSheet('own-card-form', { id }); return; }
    if (action === 'edit-expense') { openExpense(id); return; }
    if (action === 'delete-card') {
      const card = cardById(id);
      const purchases = state.third.purchases.filter(x => x.cardId === id);
      const payments = F.sum(purchases.map(x => x.installments.reduce((n, i) => n + i.payments.length, 0)));
      confirmAction('Excluir cartão', `Excluir ${card.name}? ${purchases.length} compra(s), todas as parcelas e ${payments} recebimento(s) associados também serão removidos.`, () => commitThird(next => { next.cards = next.cards.filter(x => x.id !== id); next.purchases = next.purchases.filter(x => x.cardId !== id); }, 'Cartão excluído.'), { danger: true, button: 'Excluir cartão' });
    }
    if (action === 'delete-purchase') {
      const purchase = state.third.purchases.find(x => x.id === id);
      const payments = purchase.installments.reduce((n, i) => n + i.payments.length, 0);
      confirmAction('Excluir compra', `Excluir a compra de ${purchase.person}: ${purchase.description}? ${purchase.count} parcela(s) e ${payments} recebimento(s) serão removidos.`, () => commitThird(next => { next.purchases = next.purchases.filter(x => x.id !== id); }, 'Compra excluída.'), { danger: true, button: 'Excluir compra' });
    }
    if (action === 'delete-own-card') {
      const card = state.personalCards.find(x => x.id === id);
      if (state.expenses.some(x => x.cardId === id)) { showToast('Este cartão tem despesas. Mova ou exclua as despesas antes de excluí-lo.'); return; }
      confirmAction('Excluir cartão pessoal', `Excluir ${card.name}?`, () => commitPersonal('cards', cards => { const index = cards.findIndex(x => x.id === id); cards.splice(index, 1); }, 'Cartão pessoal excluído.'), { danger: true, button: 'Excluir cartão' });
    }
    if (action === 'delete-expense') {
      const expense = state.expenses.find(x => x.id === id);
      confirmAction('Excluir despesa', `Excluir ${expense.description} e todos os pagamentos acumulados nas parcelas?`, () => commitPersonal('expenses', (_cards, expenses) => { const index = expenses.findIndex(x => x.id === id); expenses.splice(index, 1); }, 'Despesa excluída.'), { danger: true, button: 'Excluir despesa' });
    }
  }
  function navigate(page) {
    ui.page = page; ui.detail = null; ui.previousDetail = null;
    closeOverlays(); render(); animateScreen(); window.scrollTo(0, 0);
  }
  function showDetail(type, id) {
    ui.previousDetail = ui.detail && ['purchase', 'ownExpense'].includes(type) ? { ...ui.detail } : null;
    ui.detail = { type, id }; render(); animateScreen(); window.scrollTo(0, 0);
  }
  function back() {
    ui.detail = ui.previousDetail || null; ui.previousDetail = null;
    render(); animateScreen(); window.scrollTo(0, 0);
  }
  document.addEventListener('click', event => {
    const nav = event.target.closest('[data-nav]');
    if (nav) { navigate(nav.dataset.nav); return; }
    const month = event.target.closest('[data-month]');
    if (month) { const [type, offset] = month.dataset.month.split(':'); ui[`${type}Month`] = F.shiftMonth(ui[`${type}Month`], Number(offset)); render(); return; }
    const chartMonth = event.target.closest('[data-forecast-month]');
    if (chartMonth) { ui.forecastMonth = chartMonth.dataset.forecastMonth; render(); return; }
    const card = event.target.closest('[data-card]');
    if (card) { showDetail('card', card.dataset.card); return; }
    const purchase = event.target.closest('[data-purchase]');
    if (purchase) { showDetail('purchase', purchase.dataset.purchase); return; }
    const person = event.target.closest('[data-person-detail]');
    if (person) { showDetail('person', person.dataset.personDetail); return; }
    const ownCard = event.target.closest('[data-own-card]');
    if (ownCard) { showDetail('ownCard', ownCard.dataset.ownCard); return; }
    const ownExpense = event.target.closest('[data-own-expense]');
    if (ownExpense) { showDetail('ownExpense', ownExpense.dataset.ownExpense); return; }
    const ownPay = event.target.closest('[data-own-pay]');
    if (ownPay) { openOwnPayment(ownPay.dataset.ownPay); return; }
    const payEntry = event.target.closest('[data-pay-entry]');
    if (payEntry) { const x = entries().find(x => x.installment.id === payEntry.dataset.payEntry); openPayment(payEntry.dataset.payEntry, F.pending(x.installment) === 0); return; }
    const history = event.target.closest('[data-history]');
    if (history) { openPayment(history.dataset.history, true); return; }
    const paymentPerson = event.target.closest('[data-payment-person]');
    if (paymentPerson) { ui.sheet.personKey = paymentPerson.dataset.paymentPerson; ui.sheet.stage = 'installment'; renderSheet(); return; }
    const paymentEntry = event.target.closest('[data-payment-entry]');
    if (paymentEntry) { ui.sheet.installmentId = paymentEntry.dataset.paymentEntry; ui.sheet.stage = 'amount'; renderSheet(); return; }
    const editPayment = event.target.closest('[data-edit-payment]');
    if (editPayment) { ui.sheet.editPaymentId = editPayment.dataset.editPayment; ui.sheet.stage = 'amount'; renderSheet(); return; }
    const deletePayment = event.target.closest('[data-delete-payment]');
    if (deletePayment) {
      const installmentId = ui.sheet.installmentId, paymentId = deletePayment.dataset.deletePayment;
      const x = entries().find(item => item.installment.id === installmentId);
      const payment = x?.installment.payments.find(pay => pay.id === paymentId);
      if (!payment) return;
      confirmAction('Excluir recebimento', `Excluir ${F.money(payment.amountCents)} recebido em ${dateFull(payment.date)}? O saldo da parcela voltará a ficar pendente.`, () => {
        const ok = commitThird(next => { const i = F.flat(next).find(item => item.installment.id === installmentId)?.installment; if (!i) throw new Error('Parcela não encontrada.'); i.payments = i.payments.filter(pay => pay.id !== paymentId); }, 'Recebimento excluído.');
        if (ok) openPayment(installmentId, true);
        return ok;
      }, { danger: true, button: 'Excluir recebimento' });
      return;
    }
    const context = event.target.closest('[data-context]');
    if (context) { contextAction(context.dataset.context, ui.sheet.targetId); return; }
    const sheetAction = event.target.closest('[data-sheet-action]');
    if (sheetAction) {
      const action = sheetAction.dataset.sheetAction;
      if (action === 'close' || action === 'cancel-confirm') { closeOverlays(); return; }
      if (action === 'confirm') { const callback = ui.confirm; ui.confirm = null; const result = callback?.(); if (result !== false && ui.sheet?.type === 'confirm') closeOverlays(); return; }
      if (action.startsWith('export-')) { exportBackup(action.slice(7)); return; }
      if (action === 'import') { $('backupFile').click(); return; }
      if (action === 'payment-back-person') { ui.sheet.stage = 'person'; renderSheet(); $('paymentSearch')?.focus(); return; }
      if (action === 'payment-history') { ui.sheet.stage = 'history'; ui.sheet.editPaymentId = null; renderSheet(); return; }
      if (action === 'payment-add') { ui.sheet.stage = 'amount'; ui.sheet.editPaymentId = null; ui.sheet.showDate = false; renderSheet(); return; }
      if (action === 'payment-date') { const amount = $('paymentAmount').value; ui.sheet.showDate = true; renderSheet(); $('paymentAmount').value = amount; $('paymentAmount').dispatchEvent(new Event('input', { bubbles: true })); $('paymentForm [name="date"]')?.focus(); return; }
      if (action === 'purchase-back') { const form = $('purchaseStep2'); ui.sheet.draft = { ...ui.sheet.draft, purchaseDate: form.elements.purchaseDate.value, count: Number(form.elements.count.value), firstMonth: form.elements.firstMonth.value, expectedDate: form.elements.expectedDate.value }; ui.sheet.step = 1; renderSheet(); return; }
      if (action === 'own-payment-reset') {
        const { expenseId, index } = ui.sheet;
        confirmAction('Zerar pagamento', 'O valor pago desta parcela voltará a R$ 0,00. Deseja continuar?', () => {
          const ok = commitPersonal('expenses', (_cards, expenses) => { expenses.find(x => x.id === expenseId).parts[index].paid = 0; }, 'Pagamento corrigido.');
          if (ok) openSheet('own-payment', { expenseId, index, stage: 'amount' });
          return ok;
        }, { danger: true, button: 'Zerar pagamento' });
        return;
      }
    }
    const action = event.target.closest('[data-action]');
    if (!action) return;
    const type = action.dataset.action;
    if (type === 'back') back();
    else if (type === 'settings') openSheet('settings');
    else if (type === 'receive') openPayment();
    else if (type === 'receive-person') openPayment(null, false, ui.detail.id);
    else if (type === 'purchase') openPurchase();
    else if (type === 'new-card') openSheet('card-form');
    else if (type === 'new-own-card') openSheet('own-card-form');
    else if (type === 'new-expense') openExpense(null, ui.detail?.type === 'ownCard' ? ui.detail.id : null);
    else if (type === 'all-receipts') openSheet('all-receipts');
    else if (type.endsWith('-menu')) showContext(type);
  });
  document.addEventListener('input', event => {
    if (event.target.id === 'peopleSearch') { ui.peopleQuery = event.target.value; $('peopleResults').innerHTML = peopleRows(); $('peopleCount').textContent = `${people().filter(x => x.name.toLocaleLowerCase('pt-BR').includes(ui.peopleQuery.trim().toLocaleLowerCase('pt-BR'))).length} pessoa(s)`; }
    if (event.target.id === 'paymentSearch' && ui.sheet?.type === 'payment') { ui.sheet.query = event.target.value; $('paymentPeople').innerHTML = paymentPersonRows(ui.sheet.query); }
    if (event.target.id === 'paymentAmount' && ui.sheet?.type === 'payment') {
      const x = entries().find(x => x.installment.id === ui.sheet.installmentId);
      const old = x?.installment.payments.find(pay => pay.id === ui.sheet.editPaymentId);
      let value; try { value = F.parseMoney(event.target.value); } catch { value = NaN; }
      const max = x ? F.pending(x.installment) + (old?.amountCents || 0) : 0;
      $('remaining').textContent = Number.isFinite(value) && value <= max ? F.money(max - value) : '—';
    }
    if (event.target.closest('#purchaseStep2')) updatePurchasePreview();
  });
  document.addEventListener('change', event => {
    const form = event.target.closest('#purchaseStep2');
    if (!form || ui.sheet?.type !== 'purchase-form') return;
    const draft = ui.sheet.draft, card = cardById(draft.cardId);
    if (event.target.name === 'purchaseDate' && F.validDate(event.target.value) && !ui.sheet.monthManual) form.elements.firstMonth.value = F.suggestMonth(card, event.target.value);
    if ((event.target.name === 'purchaseDate' || event.target.name === 'firstMonth') && F.validMonth(form.elements.firstMonth.value) && !ui.sheet.expectedManual) form.elements.expectedDate.value = F.dayInMonth(form.elements.firstMonth.value, card.dueDay);
    if (event.target.name === 'firstMonth') ui.sheet.monthManual = true;
    if (event.target.name === 'expectedDate') ui.sheet.expectedManual = true;
  });
  document.addEventListener('submit', event => {
    const form = event.target;
    if (!['cardForm', 'purchaseStep1', 'purchaseStep2', 'paymentForm', 'ownCardForm', 'expenseForm', 'ownPaymentForm'].includes(form.id)) return;
    event.preventDefault();
    try {
      if (form.id === 'cardForm' || form.id === 'ownCardForm') {
        const data = { name: form.elements.name.value.trim(), closingDay: Number(form.elements.closingDay.value), dueDay: Number(form.elements.dueDay.value) };
        if (!data.name || ![data.closingDay, data.dueDay].every(x => Number.isInteger(x) && x >= 1 && x <= 31)) throw new Error('Informe o nome e os dias entre 1 e 31.');
        const id = ui.sheet.id;
        const ok = form.id === 'cardForm' ? commitThird(next => { if (id) Object.assign(next.cards.find(x => x.id === id), data); else next.cards.push({ id: F.uuid(), ...data }); }, 'Cartão salvo.') : commitPersonal('cards', cards => { if (id) Object.assign(cards.find(x => x.id === id), data); else cards.push({ id: F.uuid(), ...data }); }, 'Cartão pessoal salvo.');
        if (ok) closeOverlays();
      } else if (form.id === 'purchaseStep1') {
        const person = form.elements.person.value.trim(), description = form.elements.description.value.trim(), cardId = form.elements.cardId.value, total = form.elements.total.value.trim();
        F.parseMoney(total);
        if (!person || !description || !cardById(cardId)) throw new Error('Confira pessoa, compra e cartão.');
        const draft = ui.sheet.draft;
        Object.assign(draft, { person, description, cardId, total });
        if (!draft.firstMonth) draft.firstMonth = F.suggestMonth(cardById(cardId), draft.purchaseDate);
        if (!draft.expectedDate) draft.expectedDate = F.dayInMonth(draft.firstMonth, cardById(cardId).dueDay);
        ui.sheet.step = 2; renderSheet(); updatePurchasePreview();
      } else if (form.id === 'purchaseStep2') {
        const draft = ui.sheet.draft;
        const data = { person: draft.person, description: draft.description, cardId: draft.cardId, purchaseDate: form.elements.purchaseDate.value, totalCents: F.parseMoney(draft.total), count: Number(form.elements.count.value), firstMonth: form.elements.firstMonth.value, expectedDate: form.elements.expectedDate.value };
        if (!F.validDate(data.purchaseDate) || !F.validMonth(data.firstMonth) || !F.validDate(data.expectedDate)) throw new Error('Confira as datas e o mês da fatura.');
        const id = ui.sheet.id;
        const ok = commitThird(next => { const old = id ? next.purchases.find(x => x.id === id) : null; if (id && !old) throw new Error('Compra não encontrada.'); const item = F.makePurchase(data, old); if (old) next.purchases[next.purchases.findIndex(x => x.id === id)] = item; else next.purchases.push(item); }, 'Compra salva e parcelas distribuídas.');
        if (ok) closeOverlays();
      } else if (form.id === 'paymentForm') {
        const installmentId = ui.sheet.installmentId, editPaymentId = ui.sheet.editPaymentId;
        const amountCents = F.parseMoney(form.elements.amount.value), date = form.elements.date.value;
        if (!F.validDate(date) || date > today()) throw new Error('A data do recebimento deve ser válida e não pode estar no futuro.');
        const ok = commitThird(next => {
          const i = F.flat(next).find(x => x.installment.id === installmentId)?.installment;
          if (!i) throw new Error('Parcela não encontrada.');
          const old = i.payments.find(pay => pay.id === editPaymentId);
          if (editPaymentId && !old) throw new Error('Pagamento não encontrado.');
          const others = F.received(i) - (old?.amountCents || 0);
          if (others + amountCents > i.amountCents) throw new Error(`O valor ultrapassa o saldo permitido de ${F.money(i.amountCents - others)}.`);
          if (old) Object.assign(old, { amountCents, date }); else i.payments.push({ id: F.uuid(), amountCents, date });
        });
        if (ok) { ui.sheet.stage = 'success'; renderSheet(); }
      } else if (form.id === 'ownCardForm') {
        const data = { name: form.elements.name.value.trim(), closingDay: Number(form.elements.closingDay.value), dueDay: Number(form.elements.dueDay.value) };
        if (!data.name || ![data.closingDay, data.dueDay].every(x => Number.isInteger(x) && x >= 1 && x <= 31)) throw new Error('Informe o nome e os dias entre 1 e 31.');
        const id = ui.sheet.id;
        if (commitPersonal('cards', cards => { if (id) Object.assign(cards.find(x => x.id === id), data); else cards.push({ id: F.uuid(), ...data }); }, 'Cartão pessoal salvo.')) closeOverlays();
      } else if (form.id === 'expenseForm') {
        const description = form.elements.description.value.trim(), cardId = form.elements.cardId.value, total = F.parseMoney(form.elements.total.value, Number.MAX_SAFE_INTEGER), count = Number(form.elements.count.value), firstMonth = form.elements.firstMonth.value;
        if (!description || !state.personalCards.some(x => x.id === cardId) || !F.validMonth(firstMonth)) throw new Error('Confira a despesa, cartão e mês.');
        const values = F.split(total, count), id = ui.sheet.id;
        const ok = commitPersonal('expenses', (_cards, expenses) => {
          const old = id ? expenses.find(x => x.id === id) : null;
          if (id && !old) throw new Error('Despesa não encontrada.');
          if (old && old.parts.some(p => (p.paid || 0) > 0) && (old.total !== total || old.parts.length !== count || old.firstMonth !== firstMonth)) throw new Error('Esta despesa já tem pagamentos. Corrija os pagamentos antes de alterar valor, parcelas ou primeira fatura.');
          const parts = values.map((value, index) => ({ month: F.shiftMonth(firstMonth, index), value, paid: old?.parts[index]?.paid || 0 }));
          const item = { ...(old || {}), id: old?.id || F.uuid(), description, cardId, total, firstMonth, parts };
          if (old) expenses[expenses.findIndex(x => x.id === id)] = item; else expenses.push(item);
        }, 'Despesa salva.');
        if (ok) closeOverlays();
      } else if (form.id === 'ownPaymentForm') {
        const amount = F.parseMoney(form.elements.amount.value, Number.MAX_SAFE_INTEGER), { expenseId, index } = ui.sheet;
        const ok = commitPersonal('expenses', (_cards, expenses) => { const part = expenses.find(x => x.id === expenseId)?.parts[index]; if (!part) throw new Error('Parcela não encontrada.'); if (amount > part.value - (part.paid || 0)) throw new Error('O pagamento ultrapassa o saldo da parcela.'); part.paid = (part.paid || 0) + amount; });
        if (ok) { ui.sheet.stage = 'success'; renderSheet(); }
      }
    } catch (error) { showToast(storageMessage(error)); }
  });
  $('fab').addEventListener('click', openMenu);
  $('scrim').addEventListener('click', closeOverlays);
  $('closeSheet').addEventListener('click', closeOverlays);
  $('backupFile').addEventListener('change', event => { const file = event.target.files[0]; event.target.value = ''; importBackup(file); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') { closeOverlays(); return; }
    if (event.key !== 'Tab' || !ui.sheet) return;
    const focusable = [...$('appSheet').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(node => node.getClientRects().length);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable.at(-1);
    if (event.shiftKey && (document.activeElement === first || document.activeElement === $('appSheet'))) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  window.addEventListener('storage', event => { if (Object.values(F.KEYS).includes(event.key) || event.key === null) { closeOverlays(); readAll(); render(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  readAll(); render();
})();
